name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vendor/ 已随仓库提交，这里只是把页面需要的文件拣出来，
      # 不把 node_modules、serve.js、scripts/ 这些发到 Pages 上。
      - name: Assemble static site
        run: |
          mkdir -p dist/models
          cp index.html styles.css dist/
          cp -r src vendor dist/
          cp models/test-room.glb models/test-room.zip dist/models/ 2>/dev/null || true
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
